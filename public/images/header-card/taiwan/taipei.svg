<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="0.45" stop-color="#43356b"/>
      <stop offset="0.75" stop-color="#a5527a"/>
      <stop offset="1" stop-color="#e8895c"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27435c"/>
      <stop offset="0.5" stop-color="#3c6480"/>
      <stop offset="1" stop-color="#22394e"/>
    </linearGradient>
    <linearGradient id="cityA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="1" stop-color="#1c2338"/>
    </linearGradient>
    <linearGradient id="cityB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c30"/>
      <stop offset="1" stop-color="#101425"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ff9d6b"/>
      <stop offset="0.6" stop-color="#e34f3d"/>
      <stop offset="1" stop-color="#b02f2c"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>

  <!-- sun halo -->
  <circle cx="410" cy="560" r="230" fill="url(#glow)"/>
  <circle cx="410" cy="560" r="64" fill="#ffe3b3" opacity="0.9"/>

  <!-- distant mountains -->
  <path d="M0 520 L140 448 L268 512 L420 430 L560 508 L720 442 L880 516 L1030 452 L1200 512 L1200 750 L0 750 Z" fill="#2a2b4e" opacity="0.75"/>

  <!-- back skyline -->
  <g fill="url(#cityA)">
    <rect x="30" y="520" width="70" height="230"/>
    <rect x="120" y="484" width="56" height="266"/>
    <rect x="196" y="540" width="82" height="210"/>
    <rect x="300" y="500" width="60" height="250"/>
    <rect x="380" y="548" width="90" height="202"/>
    <rect x="492" y="516" width="58" height="234"/>
    <rect x="790" y="496" width="66" height="254"/>
    <rect x="874" y="532" width="88" height="218"/>
    <rect x="984" y="488" width="58" height="262"/>
    <rect x="1062" y="536" width="96" height="214"/>
