    <rect x="288" y="580" width="86" height="170"/>
    <rect x="392" y="620" width="120" height="130"/>
    <rect x="528" y="596" width="70" height="154"/>
    <rect x="740" y="606" width="96" height="144"/>
    <rect x="852" y="578" width="74" height="172"/>
    <rect x="944" y="618" width="130" height="132"/>
