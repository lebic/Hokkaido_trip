      <rect x="644" y="232" width="6" height="4"/><rect x="662" y="240" width="6" height="4"/>
      <rect x="638" y="288" width="6" height="4"/><rect x="670" y="296" width="6" height="4"/>
      <rect x="634" y="342" width="6" height="4"/><rect x="656" y="350" width="6" height="4"/><rect x="678" y="336" width="6" height="4"/>
      <rect x="630" y="398" width="6" height="4"/><rect x="664" y="406" width="6" height="4"/><rect x="686" y="392" width="6" height="4"/>
      <rect x="626" y="452" width="6" height="4"/><rect x="650" y="460" width="6" height="4"/><rect x="690" y="446" width="6" height="4"/>
      <rect x="622" y="506" width="6" height="4"/><rect x="660" y="514" width="6" height="4"/><rect x="694" y="500" width="6" height="4"/>
      <rect x="618" y="560" width="6" height="4"/><rect x="646" y="568" width="6" height="4"/><rect x="682" y="556" width="6" height="4"/>
      <rect x="614" y="614" width="6" height="4"/><rect x="656" y="622" width="6" height="4"/><rect x="698" y="610" width="6" height="4"/>
