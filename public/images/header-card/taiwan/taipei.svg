  <g fill="#ffbf74" opacity="0.7">
    <rect x="24" y="606" width="8" height="6"/><rect x="58" y="630" width="8" height="6"/><rect x="88" y="600" width="8" height="6"/>
    <rect x="170" y="636" width="8" height="6"/><rect x="214" y="660" width="8" height="6"/><rect x="244" y="628" width="8" height="6"/>
    <rect x="312" y="604" width="8" height="6"/><rect x="344" y="640" width="8" height="6"/>
