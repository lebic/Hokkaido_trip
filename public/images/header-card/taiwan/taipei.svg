    </g>
    <g transform="translate(1120,124)">
      <line x1="0" y1="-14" x2="0" y2="0" stroke="#3a2a3f" stroke-width="3"/>
      <ellipse cx="0" cy="20" rx="20" ry="24" fill="url(#lantern)"/>
      <rect x="-8" y="-5" width="16" height="6" rx="2" fill="#5c3a1e"/>
      <rect x="-8" y="40" width="16" height="6" rx="2" fill="#5c3a1e"/>
      <line x1="0" y1="46" x2="0" y2="58" stroke="#d9a441" stroke-width="3"/>
