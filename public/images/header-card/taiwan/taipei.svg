    <rect x="655" y="120" width="10" height="60" fill="#22394e"/>
    <path d="M652 176 L668 176 L672 214 L648 214 Z" fill="url(#tower)"/>
    <g fill="url(#tower)" stroke="#182a3a" stroke-width="2">
      <path d="M636 214 L684 214 L692 268 L628 268 Z"/>
      <path d="M632 268 L688 268 L696 322 L624 322 Z"/>
      <path d="M628 322 L692 322 L700 376 L620 376 Z"/>
      <path d="M624 376 L696 376 L704 430 L616 430 Z"/>
