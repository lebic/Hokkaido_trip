      <ellipse cx="0" cy="26" rx="26" ry="30" fill="url(#lantern)"/>
      <rect x="-10" y="-6" width="20" height="7" rx="2" fill="#5c3a1e"/>
      <rect x="-10" y="52" width="20" height="7" rx="2" fill="#5c3a1e"/>
      <line x1="0" y1="59" x2="0" y2="76" stroke="#d9a441" stroke-width="3"/>
