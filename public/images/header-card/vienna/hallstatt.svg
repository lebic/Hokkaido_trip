<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hallstatt">
  <defs>
    <linearGradient id="ha-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaf0"/>
      <stop offset="0.55" stop-color="#cdddE6"/>
      <stop offset="1" stop-color="#bcd0dc"/>
    </linearGradient>
    <linearGradient id="ha-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8a94"/>
      <stop offset="0.5" stop-color="#4a747f"/>
      <stop offset="1" stop-color="#3c626c"/>
    </linearGradient>
    <linearGradient id="ha-mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a97a0"/>
      <stop offset="1" stop-color="#6f7d86"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ha-sky)"/>
  <!-- steep alpine mountains -->
  <path d="M0 40 L150 220 L250 120 L360 260 L470 90 L600 250 L720 140 L800 240 L800 300 L0 300 Z" fill="url(#ha-mtn)"/>
  <path d="M470 90 L512 150 L428 150 Z M250 120 L286 168 L214 168 Z M720 140 L752 184 L688 184 Z" fill="#eef3f6" opacity="0.9"/>
  <!-- forested lower slope -->
  <path d="M0 250 L140 210 L300 250 L470 205 L640 250 L800 220 L800 330 L0 330 Z" fill="#4f6b52"/>
  <path d="M0 288 L180 262 L360 292 L540 260 L720 294 L800 274 L800 340 L0 340 Z" fill="#3f5a44"/>
  <!-- village houses stacked on the shore -->
  <g>
    <rect x="250" y="286" width="46" height="44" fill="#e7d9c2"/>
    <rect x="300" y="296" width="40" height="40" fill="#d8c3a6"/>
    <rect x="220" y="300" width="34" height="36" fill="#dccbb0"/>
    <rect x="345" y="288" width="44" height="48" fill="#eaddc7"/>
    <rect x="395" y="300" width="38" height="38" fill="#d6c4a8"/>
    <path d="M246 286 L273 266 L300 286 Z" fill="#9c4f38"/>
    <path d="M296 296 L320 278 L344 296 Z" fill="#b06a4a"/>
    <path d="M216 300 L237 284 L258 300 Z" fill="#8f4a35"/>
    <path d="M341 288 L367 268 L393 288 Z" fill="#a85c40"/>
    <path d="M391 300 L414 284 L437 300 Z" fill="#b06a4a"/>
  </g>
  <!-- iconic church with tall spire -->
  <g>
    <rect x="316" y="238" width="20" height="60" fill="#e6d7bd"/>
    <path d="M314 238 L326 210 L338 238 Z" fill="#7d5a44"/>
    <rect x="323" y="200" width="6" height="12" fill="#7d5a44"/>
    <circle cx="323" cy="248" r="4" fill="#8a704f"/>
  </g>
  <!-- small windows -->
  <g fill="#8a7355" opacity="0.8">
    <rect x="262" y="300" width="6" height="9"/><rect x="278" y="300" width="6" height="9"/>
    <rect x="356" y="302" width="6" height="9"/><rect x="372" y="302" width="6" height="9"/>
    <rect x="228" y="312" width="6" height="8"/>
  </g>
  <!-- lake -->
  <rect x="0" y="330" width="800" height="150" fill="url(#ha-lake)"/>
  <!-- reflection of village + spire -->
  <g opacity="0.28">
    <rect x="316" y="332" width="20" height="52" fill="#e6d7bd"/>
    <rect x="250" y="332" width="46" height="34" fill="#e7d9c2"/>
    <rect x="345" y="332" width="44" height="36" fill="#eaddc7"/>
  </g>
  <g fill="#ffffff" opacity="0.14">
    <rect x="90" y="360" width="150" height="4" rx="2"/>
    <rect x="420" y="378" width="180" height="4" rx="2"/>
    <rect x="160" y="410" width="220" height="4" rx="2"/>
    <rect x="480" y="426" width="160" height="4" rx="2"/>
  </g>
  <!-- little boat -->
  <path d="M120 402 q26 16 52 0 z" fill="#5a4632"/>
  <rect x="144" y="386" width="3" height="16" fill="#5a4632"/>
</svg>
