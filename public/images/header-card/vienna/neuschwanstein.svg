<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Chateau de Neuschwanstein">
  <defs>
    <linearGradient id="ns-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eef2"/>
      <stop offset="0.55" stop-color="#d3e0e6"/>
      <stop offset="1" stop-color="#c1d2da"/>
    </linearGradient>
    <linearGradient id="ns-mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b98a2"/>
      <stop offset="1" stop-color="#707e88"/>
    </linearGradient>
    <linearGradient id="ns-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7f9a"/>
      <stop offset="1" stop-color="#44607a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ns-sky)"/>
  <circle cx="640" cy="96" r="42" fill="#f3ede0" opacity="0.7"/>
  <!-- alps -->
  <path d="M0 60 L150 210 L250 120 L380 250 L500 96 L640 240 L760 150 L800 220 L800 300 L0 300 Z" fill="url(#ns-mtn)"/>
  <path d="M500 96 L544 158 L456 158 Z M250 120 L288 172 L212 172 Z" fill="#eef4f7" opacity="0.9"/>
  <!-- forested hill under the castle -->
  <path d="M0 250 L160 214 L340 258 L520 214 L680 258 L800 226 L800 360 L0 360 Z" fill="#4f6b4c"/>
  <path d="M0 292 L200 266 L400 300 L600 266 L800 300 L800 380 L0 380 Z" fill="#3f5a40"/>

  <!-- castle on a rocky crag, centre-left -->
  <g>
    <!-- rock base -->
    <path d="M250 230 L470 230 L500 300 L230 300 Z" fill="#7d766a"/>
    <!-- main walls -->
    <rect x="286" y="150" width="150" height="90" fill="#f3ecdf"/>
    <rect x="270" y="188" width="60" height="52" fill="#ebe2d1"/>
    <rect x="404" y="176" width="46" height="64" fill="#ebe2d1"/>
    <!-- gatehouse (reddish) -->
    <rect x="300" y="196" width="40" height="44" fill="#c98f74"/>
    <!-- towers -->
    <rect x="330" y="96" width="34" height="120" fill="#f6efe3"/>
    <rect x="404" y="120" width="26" height="90" fill="#f3ecdf"/>
    <rect x="276" y="150" width="22" height="70" fill="#f3ecdf"/>
    <!-- conical / spire roofs -->
    <path d="M328 96 L347 56 L366 96 Z" fill="url(#ns-roof)"/>
    <rect x="344" y="44" width="6" height="14" fill="#44607a"/>
    <path d="M402 120 L417 86 L432 120 Z" fill="url(#ns-roof)"/>
    <path d="M274 150 L287 122 L300 150 Z" fill="url(#ns-roof)"/>
    <path d="M284 150 L361 118 L438 150 L436 156 L286 156 Z" fill="url(#ns-roof)" opacity="0.9"/>
    <!-- windows -->
    <g fill="#7d6a86">
      <rect x="300" y="168" width="8" height="16" rx="3"/>
      <rect x="316" y="168" width="8" height="16" rx="3"/>
      <rect x="360" y="168" width="8" height="16" rx="3"/>
      <rect x="378" y="168" width="8" height="16" rx="3"/>
      <rect x="342" y="120" width="8" height="16" rx="3"/>
      <rect x="412" y="150" width="8" height="14" rx="3"/>
    </g>
    <!-- gate arch -->
    <path d="M312 240 L312 218 a8 8 0 0 1 16 0 L328 240 Z" fill="#6a4b3a"/>
  </g>

  <!-- Alpsee hint bottom-right -->
  <path d="M560 340 Q680 322 800 344 L800 380 L560 380 Z" fill="#4f7c86"/>
  <g fill="#ffffff" opacity="0.13"><rect x="600" y="352" width="120" height="4" rx="2"/><rect x="640" y="366" width="90" height="4" rx="2"/></g>
</svg>
