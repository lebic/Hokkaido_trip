<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Salzbourg">
  <defs>
    <linearGradient id="sz-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dcb8"/>
      <stop offset="0.55" stop-color="#eec79d"/>
      <stop offset="1" stop-color="#e0b48c"/>
    </linearGradient>
    <linearGradient id="sz-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86aab6"/>
      <stop offset="1" stop-color="#5c8090"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sz-sky)"/>
  <circle cx="618" cy="112" r="48" fill="#fbecd0" opacity="0.85"/>
  <!-- far alps -->
  <path d="M0 205 L110 128 L200 185 L300 108 L410 190 L520 120 L640 188 L740 132 L800 172 L800 320 L0 320 Z" fill="#b9c1cb" opacity="0.65"/>
  <path d="M300 108 L330 138 L270 138 Z M520 120 L548 150 L492 150 Z M110 128 L138 156 L82 156 Z" fill="#f2f4f7" opacity="0.8"/>
  <!-- mid ridge -->
  <path d="M0 250 L150 205 L320 245 L470 200 L640 250 L800 215 L800 340 L0 340 Z" fill="#94a382"/>
  <!-- fortress hill -->
  <path d="M430 265 Q545 150 660 265 L660 330 L430 330 Z" fill="#7d8d64"/>
  <!-- Hohensalzburg fortress -->
  <g fill="#e9dcc4" stroke="#c9b899" stroke-width="2">
    <rect x="512" y="188" width="96" height="58"/>
    <rect x="500" y="210" width="120" height="40"/>
    <rect x="530" y="160" width="24" height="34"/>
    <rect x="566" y="168" width="20" height="26"/>
  </g>
  <path d="M528 160 L542 146 L556 160 Z" fill="#a9553a"/>
  <path d="M564 168 L576 156 L588 168 Z" fill="#a9553a"/>
  <!-- old town rooftops -->
  <g>
    <rect x="60" y="286" width="70" height="60" fill="#e6d8c1"/>
    <rect x="140" y="298" width="60" height="48" fill="#ddccb2"/>
    <rect x="210" y="280" width="80" height="66" fill="#eaddc6"/>
    <rect x="300" y="300" width="66" height="46" fill="#d8c7ad"/>
    <path d="M55 286 L95 262 L135 286 Z" fill="#b06a4a"/>
    <path d="M205 280 L250 254 L295 280 Z" fill="#b06a4a"/>
    <path d="M135 298 L170 278 L205 298 Z" fill="#c17a56"/>
    <path d="M295 300 L333 280 L371 300 Z" fill="#c17a56"/>
    <!-- baroque dome -->
    <ellipse cx="250" cy="252" rx="20" ry="16" fill="#8fae9d"/>
    <rect x="246" y="230" width="8" height="22" fill="#8fae9d"/>
    <circle cx="250" cy="228" r="4" fill="#d8b24a"/>
    <!-- twin spires -->
    <rect x="164" y="250" width="10" height="30" fill="#cbb592"/>
    <path d="M162 250 L169 236 L176 250 Z" fill="#8fae9d"/>
    <rect x="182" y="250" width="10" height="30" fill="#cbb592"/>
    <path d="M180 250 L187 236 L194 250 Z" fill="#8fae9d"/>
  </g>
  <!-- windows -->
  <g fill="#9a8158" opacity="0.75">
    <rect x="74" y="300" width="8" height="12"/><rect x="94" y="300" width="8" height="12"/><rect x="114" y="300" width="8" height="12"/>
    <rect x="224" y="296" width="8" height="12"/><rect x="244" y="296" width="8" height="12"/><rect x="264" y="296" width="8" height="12"/>
    <rect x="316" y="314" width="8" height="10"/><rect x="336" y="314" width="8" height="10"/>
  </g>
  <!-- river Salzach -->
  <rect x="0" y="346" width="800" height="134" fill="url(#sz-water)"/>
  <g fill="#ffffff" opacity="0.18">
    <rect x="60" y="366" width="120" height="4" rx="2"/>
    <rect x="220" y="384" width="160" height="4" rx="2"/>
    <rect x="500" y="372" width="140" height="4" rx="2"/>
    <rect x="120" y="410" width="200" height="4" rx="2"/>
    <rect x="440" y="420" width="180" height="4" rx="2"/>
  </g>
  <!-- bridge -->
  <rect x="330" y="352" width="150" height="10" fill="#7a6a52"/>
  <g fill="#7a6a52"><rect x="352" y="362" width="8" height="18"/><rect x="402" y="362" width="8" height="18"/><rect x="452" y="362" width="8" height="18"/></g>
</svg>
