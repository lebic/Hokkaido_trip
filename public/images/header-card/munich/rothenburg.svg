<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b2c2d8"/>
      <stop offset="0.45" stop-color="#dadfe4"/>
      <stop offset="0.75" stop-color="#f3e4c6"/>
    </linearGradient>
    <radialGradient id="rbSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6a05c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c6a05c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rbRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a2f3e"/>
      <stop offset="1" stop-color="#7c2333"/>
    </linearGradient>
    <linearGradient id="rbYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b04e"/>
      <stop offset="1" stop-color="#f4d37c"/>
