    <linearGradient id="rbStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7b79f"/>
      <stop offset="0.6" stop-color="#eee3d0"/>
      <stop offset="1" stop-color="#e0d0b6"/>
    </linearGradient>
    <linearGradient id="rbFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece3d6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ece3d6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rbCobble" width="40" height="24" patternUnits="userSpaceOnUse">
