        <rect x="-8" y="13" width="16" height="9" rx="4"/>
        <rect x="12" y="13" width="16" height="9" rx="4"/>
        <rect x="32" y="13" width="16" height="9" rx="4"/>
      </g>
    </pattern>
    <path id="rbGround" d="M0 644 L180 610 L340 572 L440 572 L520 598 L700 600 L760 576 L960 606 L1200 640 V750 H0Z"/>
