<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="asSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b8d3"/>
      <stop offset="0.45" stop-color="#e0dbd0"/>
      <stop offset="0.75" stop-color="#f1cf98"/>
    </linearGradient>
    <radialGradient id="asSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8e0aa" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#c6a05c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c6a05c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asAlps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f2f0"/>
      <stop offset="1" stop-color="#8a9aba"/>
    </linearGradient>
    <linearGradient id="asBrick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3330"/>
      <stop offset="0.65" stop-color="#9a4a3c"/>
      <stop offset="1" stop-color="#b8664a"/>
    </linearGradient>
    <linearGradient id="asDome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6b5c"/>
      <stop offset="0.6" stop-color="#6f9c88"/>
      <stop offset="1" stop-color="#b5cdb0"/>
    </linearGradient>
    <linearGradient id="asStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d545f"/>
      <stop offset="0.6" stop-color="#857781"/>
      <stop offset="1" stop-color="#a68f86"/>
    </linearGradient>
    <path id="asW" d="M0 38 V12 Q6 0 12 12 V38Z"/>
    <pattern id="asWins" x="262" y="470" width="36" height="64" patternUnits="userSpaceOnUse">
      <use href="#asW" x="12" y="14" fill="#3a3340"/>
    </pattern>
    <pattern id="asArcade" x="262" y="610" width="52" height="50" patternUnits="userSpaceOnUse">
      <path d="M8 50 V20 Q26 0 44 20 V50Z" fill="#2f2a33"/>
    </pattern>
    <!-- one Frauenkirche tower, centred on x=0 -->
    <g id="asTower">
      <rect x="-42" y="236" width="84" height="420" fill="url(#asBrick)"/>
      <rect x="-34" y="166" width="68" height="72" fill="url(#asBrick)"/>
      <path d="M-22 250 V650 M22 250 V650 M-16 168 V236 M16 168 V236" stroke="#5e2a29" stroke-width="3" opacity="0.5"/>
      <path d="M-6 340 v-44 q6 -14 12 0 v44z M-5 226 v-32 q5 -12 10 0 v32z" fill="#3a2a2c"/>
      <path d="M34 238 h6 v418 h-6Z M28 168 h6 v62 h-6Z" fill="#f6dca6" opacity="0.3"/>
      <rect x="-46" y="230" width="92" height="8" rx="3" fill="#f6f2ea"/>
      <rect x="-8" y="70" width="16" height="30" fill="#3f6b5c"/>
      <path d="M-38 166 C-52 128 -20 120 -8 98 H8 C20 120 52 128 38 166Z" fill="url(#asDome)"/>
      <path d="M-12 74 Q0 54 12 74Z" fill="url(#asDome)"/>
      <path d="M0 62 V36" stroke="#c6a05c" stroke-width="3"/>
      <circle cy="38" r="4" fill="#c6a05c"/>
      <path d="M30 158 C38 136 24 126 10 108" fill="none" stroke="#f6dca6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <rect x="-40" y="162" width="80" height="7" rx="3" fill="#f6f2ea"/>
    </g>
  </defs>

  <rect width="1200" height="750" fill="url(#asSky)"/>
  <circle cx="960" cy="360" r="340" fill="url(#asSun)"/>
  <circle cx="960" cy="360" r="44" fill="#fbe6b8"/>

  <!-- Alps on the horizon, a clear Foehn day -->
  <path d="M0 470 L90 432 L150 452 L230 410 L300 446 L360 424 L430 456 L520 428 L600 458 L700 420 L780 450 L860 414 L940 448 L1020 422 L1100 452 L1200 426 V560 H0Z" fill="url(#asAlps)" opacity="0.6"/>

  <!-- old-town roofs behind -->
  <path d="M240 420 V384 L290 350 L340 384 H420 V420Z M840 420 V392 L900 356 L960 392 L1010 374 L1060 400 V420Z" fill="#9aa6bd"/>
  <path d="M240 384 L290 350 L340 384 M840 392 L900 356 L960 392 L1010 374 L1060 400" fill="none" stroke="#f6f2ea" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Frauenkirche: nave roof and twin towers -->
  <path d="M588 470 L640 300 L870 300 L912 470Z" fill="#8a3d33"/>
  <path d="M640 300 L870 300 L894 400 Q820 410 750 398 Q680 410 618 396Z" fill="#f4f1ec"/>
  <path d="M472 360 L495 334 L518 360 V660 H472Z" fill="#7d3b32"/>
  <use href="#asTower" x="430" y="40"/>
  <use href="#asTower" x="560" y="40"/>

  <!-- jackdaws -->
  <g stroke="#3a3340" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M290 170 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M340 214 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M810 150 q9 -9 18 0 q9 -9 18 0"/>
  </g>

  <!-- houses around Marienplatz -->
  <path d="M-10 432 L56 380 L122 432 L180 382 L250 432 V660 H-10Z" fill="#dccdbd"/>
  <path d="M1050 432 L1120 378 L1190 432 L1210 420 V660 H1050Z" fill="#ecd9bf"/>
  <rect x="10" y="476" width="228" height="120" fill="url(#asWins)"/>
  <rect x="1060" y="476" width="150" height="120" fill="url(#asWins)"/>
  <path d="M-14 436 L56 376 L122 432 L180 378 L254 436 M1046 436 L1120 374 L1194 436" fill="none" stroke="#7c2333" stroke-width="16" stroke-linejoin="round"/>
  <path d="M-14 430 L56 370 L122 426 L180 372 L254 430 M1046 430 L1120 368 L1194 430" fill="none" stroke="#f6f2ea" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neues Rathaus: snowy roof, gabled facade, arcades -->
  <path d="M250 470 L290 400 L1010 400 L1050 470Z" fill="#eceef2"/>
  <rect x="250" y="456" width="800" height="8" fill="#c9cfd9"/>
  <path d="M270 462 L300 414 L330 462Z M350 462 L380 414 L410 462Z M430 462 L460 414 L490 462Z M510 462 L540 414 L570 462Z M590 462 L620 414 L650 462Z M750 462 L780 414 L810 462Z M830 462 L860 414 L890 462Z M910 462 L940 414 L970 462Z M990 462 L1020 414 L1050 462Z M300 414 V398 M380 414 V398 M460 414 V398 M540 414 V398 M620 414 V398 M780 414 V398 M860 414 V398 M940 414 V398 M1020 414 V398" fill="#7a6c74" stroke="#7a6c74" stroke-width="4"/>
  <rect x="250" y="460" width="800" height="190" fill="url(#asStone)"/>
  <rect x="246" y="458" width="808" height="7" rx="3" fill="#f6f2ea"/>
  <rect x="262" y="476" width="768" height="120" fill="url(#asWins)"/>
  <g fill="#f2c983">
    <use href="#asW" x="310" y="484"/>
    <use href="#asW" x="418" y="548"/>
    <use href="#asW" x="490" y="484"/>
    <use href="#asW" x="814" y="484"/>
    <use href="#asW" x="922" y="548"/>
    <use href="#asW" x="994" y="484"/>
  </g>
  <rect x="250" y="600" width="800" height="6" fill="#9b8a87"/>
  <rect x="262" y="610" width="780" height="40" fill="url(#asArcade)"/>

  <!-- Rathaus tower with the Glockenspiel oriel -->
  <rect x="660" y="206" width="80" height="450" fill="url(#asStone)"/>
  <path d="M672 220 V650 M728 220 V650" stroke="#4d4550" stroke-width="4"/>
  <rect x="734" y="210" width="6" height="440" fill="#f6dca6" opacity="0.35"/>
  <circle cx="700" cy="240" r="17" fill="#f0e4d3"/>
  <path d="M700 240 V228 M700 240 H710" stroke="#211d24" stroke-width="3" stroke-linecap="round"/>
  <path d="M684 318 V280 Q690 268 696 280 V318Z M704 318 V280 Q710 268 716 280 V318Z M684 540 V470 Q690 456 696 470 V540Z M704 540 V470 Q710 456 716 470 V540Z M676 656 V610 Q700 582 724 610 V656Z" fill="#3a3340"/>
  <path d="M640 340 L700 318 L760 340Z" fill="#4d4550"/>
  <rect x="648" y="338" width="104" height="100" fill="#8a7a80"/>
  <path d="M662 382 V358 Q670 346 678 358 V382Z M692 382 V358 Q700 346 708 358 V382Z M722 382 V358 Q730 346 738 358 V382Z M662 428 V404 Q670 392 678 404 V428Z M692 428 V404 Q700 392 708 404 V428Z M722 428 V404 Q730 392 738 404 V428Z" fill="#e2b867"/>
  <rect x="646" y="194" width="108" height="14" fill="#6a5e66"/>
  <path d="M644 196 L652 146 L660 196Z M740 196 L748 146 L756 196Z" fill="#5d545f"/>
  <rect x="678" y="118" width="44" height="80" fill="url(#asStone)"/>
  <path d="M694 186 V150 Q700 138 706 150 V186Z" fill="#3a3340"/>
  <path d="M670 122 L700 40 L730 122Z" fill="#4c6f62"/>
  <path d="M703 50 L725 116" stroke="#f6dca6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M700 42 V28" stroke="#c6a05c" stroke-width="3"/>
  <circle cx="700" cy="25" r="5" fill="#c6a05c"/>
  <path d="M642 194 H758 M674 118 H726 M640 338 L700 316 L760 338" fill="none" stroke="#f6f2ea" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mariensaeule with its golden Madonna -->
  <circle cx="331" cy="486" r="44" fill="url(#asSun)" opacity="0.7"/>
  <rect x="325" y="506" width="12" height="130" fill="#8f5b52"/>
  <rect x="319" y="500" width="24" height="8" rx="2" fill="#c6a05c"/>
  <path d="M331 466 Q321 482 323 500 H339 Q341 482 331 466Z" fill="#c6a05c"/>
  <circle cx="331" cy="464" r="5" fill="#e2b867"/>
  <rect x="308" y="628" width="46" height="26" fill="#8a7d82"/>
  <rect x="304" y="622" width="54" height="8" rx="3" fill="#f6f2ea"/>

  <!-- snowy square -->
  <rect y="650" width="1200" height="100" fill="#e6ded2"/>
  <path d="M0 662 Q300 650 600 664 Q900 650 1200 662 V750 H0Z" fill="#f8f6f1"/>
  <path d="M660 650 H740 L560 750 H420Z" fill="#60769e" opacity="0.12"/>
  <path d="M0 750 V716 Q300 700 600 718 Q900 700 1200 714 V750Z" fill="#dde3ec"/>
  <g fill="#211d24" opacity="0.8">
    <circle cx="520" cy="672" r="5"/>
    <circle cx="548" cy="676" r="5"/>
    <circle cx="860" cy="670" r="5"/>
    <rect x="514" y="678" width="12" height="22" rx="5"/>
    <rect x="854" y="676" width="12" height="22" rx="5"/>
  </g>
  <rect x="542" y="682" width="12" height="20" rx="5" fill="#9a2f3e"/>
</svg>
