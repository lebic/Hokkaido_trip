<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b8cd"/>
      <stop offset="0.5" stop-color="#d6dbe1"/>
      <stop offset="0.8" stop-color="#eee6d8"/>
    </linearGradient>
    <radialGradient id="bbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6a05c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c6a05c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bbRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e3a34"/>
      <stop offset="1" stop-color="#6b2a2b"/>
    </linearGradient>
    <linearGradient id="bbWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcd8d3"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="bbIce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e0e9"/>
      <stop offset="1" stop-color="#aab9cd"/>
    </linearGradient>
    <pattern id="bbWins" x="596" y="410" width="54" height="60" patternUnits="userSpaceOnUse">
      <rect width="18" height="30" rx="2" fill="#5c5866"/>
    </pattern>
    <path id="bbArch" d="M0 0 V-34 Q8 -50 16 -34 V0Z"/>
  </defs>

  <rect width="1200" height="750" fill="url(#bbSky)"/>
  <circle cx="300" cy="430" r="320" fill="url(#bbGlow)"/>
  <circle cx="300" cy="430" r="30" fill="#f6ead0" opacity="0.8"/>

  <!-- bare woods along the Wuerm -->
  <path d="M0 500 Q40 420 100 460 Q150 400 210 452 Q260 410 320 456 Q380 396 440 450 Q500 410 560 452 Q620 400 680 448 Q740 410 800 454 Q860 398 920 450 Q980 412 1040 456 Q1100 404 1160 452 Q1185 430 1200 440 V600 H0Z" fill="#60769e" opacity="0.22"/>
  <path d="M0 540 Q60 480 130 510 Q200 460 270 506 Q340 470 400 508 H820 Q880 470 950 506 Q1020 464 1090 504 Q1150 476 1200 496 V600 H0Z" fill="#60769e" opacity="0.2"/>
  <rect y="548" width="1200" height="50" fill="#eef0f2"/>

  <!-- castle chapel with its ridge turret -->
  <rect x="352" y="262" width="16" height="40" fill="#f1eee8"/>
  <path d="M348 266 L360 206 L372 266Z" fill="url(#bbRoof)"/>
  <path d="M360 206 V186 M354 194 H366" stroke="#6b2a2b" stroke-width="3"/>
  <path d="M292 408 L316 296 L496 296 L532 408Z" fill="url(#bbRoof)"/>
  <path d="M316 296 L496 296 L510 338 Q470 348 420 340 Q370 350 306 340Z" fill="#f6f5f1"/>
  <rect x="300" y="404" width="200" height="170" fill="url(#bbWall)"/>
  <g fill="#d2ccc4">
    <rect x="352" y="420" width="8" height="150"/>
    <rect x="398" y="420" width="8" height="150"/>
    <rect x="444" y="420" width="8" height="150"/>
  </g>
  <g fill="#5c5866">
    <use href="#bbArch" x="326" y="490"/>
    <use href="#bbArch" x="372" y="490"/>
    <use href="#bbArch" x="418" y="490"/>
    <use href="#bbArch" x="464" y="490"/>
  </g>

  <!-- residence with steep hipped roof -->
  <path d="M552 388 L620 250 L796 250 L864 388Z" fill="url(#bbRoof)"/>
  <path d="M620 250 L796 250 L816 290 Q760 300 700 292 Q640 302 600 290Z" fill="#f6f5f1"/>
  <path d="M640 352 L654 324 L668 352Z M752 352 L766 324 L780 352Z" fill="#ebe7e1"/>
  <rect x="566" y="384" width="284" height="196" fill="url(#bbWall)"/>
  <rect x="590" y="404" width="250" height="120" fill="url(#bbWins)"/>

  <!-- square tower -->
  <rect x="500" y="290" width="66" height="290" fill="url(#bbWall)"/>
  <path d="M490 294 L533 172 L576 294Z" fill="url(#bbRoof)"/>
  <g fill="#5c5866">
    <rect x="526" y="330" width="14" height="22" rx="2"/>
    <rect x="526" y="400" width="14" height="22" rx="2"/>
  </g>

  <!-- enclosure wall and round corner towers -->
  <rect x="262" y="512" width="640" height="70" fill="#e6e1d9"/>
  <rect x="236" y="470" width="54" height="112" fill="url(#bbWall)"/>
  <rect x="876" y="470" width="54" height="112" fill="url(#bbWall)"/>
  <path d="M228 474 L263 398 L298 474Z M868 474 L903 398 L938 474Z" fill="url(#bbRoof)"/>
  <g fill="#5c5866">
    <rect x="258" y="500" width="10" height="18" rx="5"/>
    <rect x="898" y="500" width="10" height="18" rx="5"/>
  </g>
  <path d="M262 510 H902 M224 474 H302 M864 474 H942 M257 410 L263 400 L269 410 M897 410 L903 400 L909 410 M488 294 H578 M527 184 L533 174 L539 184" fill="none" stroke="#f9f8f5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect y="560" width="1200" height="36" fill="#f0e4d3" opacity="0.3"/>

  <!-- frozen moat -->
  <rect y="590" width="1200" height="160" fill="url(#bbIce)"/>
  <g fill="#ffffff" opacity="0.25">
    <rect x="262" y="596" width="640" height="40"/>
    <rect x="236" y="596" width="54" height="70"/>
    <rect x="876" y="596" width="54" height="70"/>
  </g>
  <path d="M120 650 H360 M520 694 H720 M800 660 H1010 M280 720 H470" stroke="#f4f6f9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <g fill="#f4f5f7" opacity="0.7">
    <ellipse cx="620" cy="652" rx="120" ry="10"/>
    <ellipse cx="200" cy="690" rx="90" ry="8"/>
    <ellipse cx="1000" cy="702" rx="110" ry="9"/>
  </g>
  <path d="M170 596 Q220 572 262 578 H904 Q960 572 1020 598Z" fill="#f9f8f5"/>

  <!-- near bank with dry reeds -->
  <path d="M0 750 V694 Q200 670 420 690 Q700 714 980 686 Q1100 674 1200 682 V750Z" fill="#f7f6f2"/>
  <path d="M0 750 V728 Q400 706 760 730 Q1000 716 1200 726 V750Z" fill="#dde3ec"/>
  <path d="M300 700 L292 652 M312 702 L316 642 M324 700 L336 656 M860 700 L852 650 M872 700 L878 642 M884 700 L896 656" stroke="#8a7a68" stroke-width="3" stroke-linecap="round"/>

  <!-- bare trees framing the view -->
  <g id="bbTree" fill="none" stroke="#4a4450" stroke-linecap="round">
    <path d="M140 720 Q150 520 176 300" stroke-width="16"/>
    <path d="M160 470 Q110 400 60 360 M170 380 Q220 320 250 250 M176 300 Q170 230 190 170 M150 560 Q90 520 30 520" stroke-width="7"/>
    <path d="M60 360 Q40 320 30 280 M90 386 L70 330 M250 250 L280 210 M226 300 L268 290 M190 170 L170 120 M190 170 L214 128 M110 410 L120 360 M30 520 L0 500 M80 532 L60 490" stroke-width="3"/>
  </g>
  <use href="#bbTree" transform="translate(1230 20) scale(-0.92 0.96)"/>
</svg>
