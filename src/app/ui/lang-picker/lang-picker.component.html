<div class="flex items-center gap-0.5">
  @for (locale of locales; track locale.code) {
    <button
      type="button"
      (click)="translationService.setLocale(locale.code)"
      [class]="translationService.locale() === locale.code
        ? 'tb-accent-soft rounded-full px-3 py-2 text-sm font-semibold transition'
        : 'rounded-full border border-transparent px-3 py-2 text-sm font-medium text-[color:var(--tb-muted)] transition hover:bg-black/[0.04] hover:text-[color:var(--tb-ink)]'"
    >
      {{ locale.flag }}&nbsp;{{ locale.code | uppercase }}
    </button>
  }
</div>
