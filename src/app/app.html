<div class="relative z-0 min-h-screen overflow-x-hidden text-[color:var(--tb-ink)]">
  <header
    class="fixed left-0 right-0 top-0 z-30 flex items-center justify-between gap-4 border-b border-black/5 bg-white/80 px-5 py-3.5 backdrop-blur-xl sm:px-6"
  >
    <a routerLink="/voyages" class="flex items-center gap-3">
      <span class="tb-accent-bg flex h-9 w-9 items-center justify-center rounded-xl text-base shadow-sm" aria-hidden="true">✦</span>
      <span class="flex flex-col leading-none">
        <span class="font-display text-lg font-semibold tracking-tight">{{ translationService.t().nav.brand }}</span>
        <span class="mt-0.5 text-[0.62rem] font-medium uppercase tracking-[0.2em] text-[color:var(--tb-muted)]">{{ travelService.currentTravelLocalized().name }}</span>
      </span>
    </a>

    <div class="flex items-center gap-3">
      <app-button
        className="md:hidden border border-black/10 bg-white/60 px-4 py-2 text-[0.65rem] tracking-[0.2em]"
        variant="outline"
        size="sm"
        [ariaExpanded]="isMenuOpen()"
        ariaControls="site-nav"
        (click)="toggleMenu()"
      >
        <span class="flex flex-col gap-1" aria-hidden="true">
          <span class="h-0.5 w-4 rounded-full bg-current"></span>
          <span class="h-0.5 w-4 rounded-full bg-current"></span>
          <span class="h-0.5 w-4 rounded-full bg-current"></span>
        </span>
        Menu
      </app-button>
    </div>

    <nav
      id="site-nav"
      class="absolute left-4 right-4 top-full z-40 mt-2 flex flex-col gap-1 rounded-2xl border border-black/10 bg-white/95 p-3 shadow-2xl shadow-black/20 backdrop-blur-xl md:static md:z-auto md:mt-0 md:!flex md:flex-row md:items-center md:gap-1 md:border-0 md:!bg-transparent md:p-0 md:shadow-none md:backdrop-blur-none"
      [class.hidden]="!isMenuOpen()"
    >
      <app-nav-link to="/voyages" (click)="closeMenu()">{{ translationService.t().nav.voyages }}</app-nav-link>
      <app-nav-link to="/itineraire" (click)="closeMenu()">{{ translationService.t().nav.itineraire }}</app-nav-link>
      <app-nav-link to="/preparatifs" (click)="closeMenu()">{{ translationService.t().nav.preparatifs }}</app-nav-link>

      <span class="mx-1 hidden h-4 w-px bg-black/15 md:block"></span>
      <app-lang-picker />
    </nav>
  </header>

  <main class="relative z-0 mx-auto w-full max-w-5xl px-5 pb-16 pt-24 sm:px-6">
    <router-outlet></router-outlet>
  </main>
</div>
